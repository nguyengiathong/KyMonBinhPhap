name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Optional private signing key, kept in repository secrets (see README).
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KMBP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KMBP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KMBP_KEYSTORE_PASSWORD: ${{ secrets.KMBP_KEYSTORE_PASSWORD }}
          KMBP_KEY_ALIAS: ${{ secrets.KMBP_KEY_ALIAS }}
          KMBP_KEY_PASSWORD: ${{ secrets.KMBP_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk KyMonBinhPhap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KyMonBinhPhap-${{ github.run_number }}
          path: KyMonBinhPhap.apk

      # Builds of the default branch replace the "apk" release, so the newest APK always sits at
      # https://github.com/<owner>/<repo>/releases/download/apk/KyMonBinhPhap.apk
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk KyMonBinhPhap.apk \
            --target "$GITHUB_SHA" \
            --title "Kỳ Môn Binh Pháp 1.0.${{ github.run_number }}" \
            --notes "Bản dựng tự động từ commit ${GITHUB_SHA::7}. Tải KyMonBinhPhap.apk về máy Android rồi mở để cài đặt."
